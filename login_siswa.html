<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - SimuKit</title>
    

    <link rel="stylesheet" href="login_siswa.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="split-container">
        
        
        <div class="left-side">
            <div class="content-wrapper">
                
               <div class="main-logo";>
                   <img src="assets/logoutama.png" alt="Logo SimuKit" class="main-logo">
                </div>

                <h2 class="page-title">Login Siswa</h2>

                <form class="login-form">
                    <div class="form-group">
                        <label for="username">Username/Email</label>
                        <input type="text" id="username" name="username" placeholder="">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="">
                    </div>

            
                   <button type="button" class="btn btn-login" onclick="window.location.href='dashboard_siswa.html'">
                        Login
                    </button>
                </form>


                <p class="text-divider">Atau</p>

            
                <a href="register-siswa.html" class="btn btn-register">
                    Register
                </a>

            </div>
        </div>


        <div class="right-side">
          <img src="assets/pattern.png" alt="Pattern Kuning" class="pattern-image">
        </div>

    </div>

</body>
</html>
